# Requirement -> design/ADR -> tests -> status traceability.
# status vocabulary (closed): implemented | partial | planned
# `partial` = an acceptance criterion or mandatory check is unmet; never report it as implemented.
requirements:
  - id: DR-001
    title: Faster GPU DFT-D3 with unchanged results
    source: specs/requirements/DR-001-dftd3-gpu-performance.md
    design: specs/design/DES-0001-dftd3-gpu-optimization-plan.md
    adrs: [specs/decisions/ADR-0002-dftd3-optimization-numerics.md]
    verification: [specs/verification/VER-0001-dftd3-vs-simple-dftd3, specs/verification/VER-0004-dftd3-optimization-results, specs/verification/VER-0011-dftd3-final-verification, specs/verification/VER-0012-dftd3-small-box-diagnostic, specs/verification/VER-0013-dftd3-multithread-small-box]
    tests: [tests_pytest/test_dftd3_reference.py]   # AC-1; AC-2, AC-5 per DES-0001 phases; AC-3 closed 2026-11-03 as 'no evidence of worse conservation, indistinguishable within GPU non-determinism' (VER-0011, 54 extra runs); AC-6 docs done (VER-0011); AC-4 met at N=81/648/5184 (Phase 7 (i), VER-0013), unmet only at N=41,472 (Phase 7 (v) pending); sm<60 atomicAdd fallback removed (no atomics left in dftd3.cu), AC-5 note pending
    status: planned
  - id: DR-002
    title: DFT-D2 dispersion correction added externally to NEP
    source: specs/requirements/DR-002-dftd2-external-correction.md
    design: specs/design/DES-0002-dftd2-implementation-plan.md
    adrs: []
    verification: [specs/verification/VER-0003-dftd2-parameters-and-oracle, specs/verification/VER-0005-dftd2-cutoff-study, specs/verification/VER-0006-dftd2-consistency-and-performance, specs/verification/VER-0007-dftd2-review-fixes, specs/verification/VER-0008-dftd2-optimization, specs/verification/VER-0009-dftd2-float-candidates, specs/verification/VER-0010-dftd2-final-verification]
    tests: [tests_pytest/test_dftd2_reference.py, tests_pytest/test_dftd2_src_table.py, tests_pytest/test_dftd2_consistency.py]   # AC-1..6 and 8 met; AC-4 FD at rc=12 and 30 A (VER-0010). AC-7 NOT met (measured, informative, not a gate): D2/D3 extra time <= 0.5 only at rc=12 A for N=81/648; at the default rc=30 A it is 0.66-9.3 (VER-0010). Independent reviews: no open BLOCKER/MAJOR (VER-0007, stage 3b)
    status: implemented
